name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - stable

permissions:
  contents: read

jobs:
  workflow-and-bundle:
    name: workflow-and-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run release:build -- --candidate --commit "$GITHUB_SHA"
      - name: Verify candidate artifact integrity
        run: node scripts/verify-release-assets.mjs dist

  isolated-client-installs:
    name: isolated-client-installs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm run test:installer
